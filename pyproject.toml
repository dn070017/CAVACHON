[project]
name = "cavachon"
version = "0.1.0"
description = ""
authors = [
    {name = "dn070017",email = "dn070017@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "tensorflow-probability[tf] (==0.24.0)",
    "mlflow (==2.20)",
    "muon (>=0.1.7,<0.2.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "plotly (>=6.0.0,<7.0.0)",
    "scikit-learn (>=1.1,<1.6.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tensorflow[and-cuda] (==2.16.1)",
    "networkx (>=3.4.2,<4.0.0)",
    "gseapy (>=1.1.5,<2.0.0)",
    "scanpy (>=1.11.0,<2.0.0)",
    "ipywidgets (>=8.1.5,<9.0.0)",
    "nbformat (>=4.2.0)",
    "kaleido (==0.2.1)",
    "pydantic (>=2.11.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]

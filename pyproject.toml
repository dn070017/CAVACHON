[project] 
name = "cavachon"
version = "0.1.0"
description = ""
authors = [
{name = "dn070017",email = "dn070017@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "tensorflow-probability[tf] (==0.24.0)",
  "numpy (>=1.23.5,<2.0.0)",
  "mlflow (==2.20)",
  "muon (>=0.1.7,<0.2.0)",
  "pandas (>=2.2.3,<3.0.0)",
  "plotly (>=6.0.0,<7.0.0)",
  "scikit-learn (>=1.1,<1.6.0)",
  "seaborn (>=0.13.2,<0.14.0)",
  "tensorflow[and-cuda] (==2.16.1)",
  "networkx (>=3.4.2,<4.0.0)",
  "gseapy (>=1.1.5,<2.0.0)",
  "scanpy (>=1.11.0,<2.0.0)",
  "ipywidgets (>=8.1.5,<9.0.0)",
  "nbformat (>=4.2.0)",
  "kaleido (==0.2.1)",
  "pydantic (>=2.13.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
ruff = "^0.9.7"
pytest = "^8.3.4"

[tool.pixi.activation]
env = { LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cudnn/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cuda_runtime/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cublas/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cufft/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/curand/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cusolver/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/cusparse/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/nccl/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.11/site-packages/nvidia/nvtx/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib" }

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
poetry = ">=2.0"
packaging = "<25"
numpy = ">=1.23.5,<2.0.0"

[tool.pixi.tasks]
setup = "poetry install"
setup-dev = "poetry install --with dev"
check-gpu = "python -c 'import tensorflow as tf; print(\"Devices:\", tf.config.list_physical_devices(\"GPU\"))'"


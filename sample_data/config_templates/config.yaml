io: 
  checkpointdir: ${CHECKPOINT DIRECTORY}
  datadir: ${DATASET DIRECTORY}
  outdir: ${OUTPUT DIRECTORY}
modalities:
  - name: RNA
    type: RNA
    h5ad: ${RNA H5AD File}
  - name: ATAC
    type: ATAC
    h5ad: ${ATAC H5AD File}
model:
  name: CAVACHON
  load_weights: False
  save_weights: True
  components:
    - name: ATAC
      modalities:
        - name: ATAC
    - name: RNA
      conditioned_on_z_hat: 
        - ATAC
      modalities:  
        - name: RNA
  training:
    max_regular_training_epochs: 1000
    n_parent_annealing_epochs: 1
    n_kl_annealing_epochs: 25
    enable_kmeans_init: true
    kl_annealing_ratio: [0.5, 0.2, 0.3]
    optimizer:
      name: adam
      learning_rate: 5e-4
  dataset:
    batch_size: 512
